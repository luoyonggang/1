name: Publish Drift Racing Game
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-game.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package racing game
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish racing game
        id: deployment
        uses: actions/deploy-pages@v4
